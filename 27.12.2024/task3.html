<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .test {
      font-size: 50px;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 5px;
    }
    #hour,
    #minute,
    #second {
      color: #333;
    }
    #hour:hover,
    #minute:hover,
    #second:hover {
      background-color: #ccc;
    }
  </style>
  <body>
    <div class="container">
      <div id="hour" class="test">Hour</div>
      <div id="minute" class="test">Minute</div>
      <div id="second" class="test">Second</div>
    </div>

    <script>
      let hour = prompt("saatı daxil edin");
      let minute = prompt("dəqiqəni daxil edin");
      let second = prompt("saniyeni daxil edin");

      if (isNaN(hour) || isNaN(minute) || isNaN(second)) {
        alert(
          "Sizin daxil eddiyiniz qiymetlerin eyni formatda olması lazımdır!"
        );
      } else {
        document.querySelector("#hour").innerHTML = hour
          .toString()
          .padStart(2, "0");
        document.querySelector("#minute").innerHTML = minute
          .toString()
          .padStart(2, "0");
        document.querySelector("#second").innerHTML = second
          .toString()
          .padStart(2, "0");
      }

      const q1 = setInterval(() => {
        if (hour == 0 && minute == 0 && second == 0) {
          clearInterval(q1);
          document.querySelector("#hour").style.color = "red";
          document.querySelector("#minute").style.color = "red";
          document.querySelector("#second").style.color = "red";
        }
        if (second > 0) {
          second--;
        } else if (minute > 0) {
          second = 59;
          minute--;
        } else if (hour > 0) {
          minute = 59;
          second = 59;
          hour--;
        }
        document.querySelector("#hour").innerHTML = hour
          .toString()
          .padStart(2, "0");
        document.querySelector("#minute").innerHTML = minute
          .toString()
          .padStart(2, "0");
        document.querySelector("#second").innerHTML = second
          .toString()
          .padStart(2, "0");
      }, 1000);
    </script>
  </body>
</html>
