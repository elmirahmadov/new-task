<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let promise = new Promise((resolve, reject) => {
        let success = true;
        if (success) {
          resolve("Success");
        } else {
          reject("Error");
        }
      });
      promise
        .then((message) => {
          console.log(message);
        })
        .catch((message) => {
          console.log(message);
        });

      const myPromise = new Promise((resolve, reject) => {
        reject("Error");
      });
      myPromise.catch((error) => {
        console.log(error);
      });

      function checkNumber(number) {
        return new Promise((resolve, reject) => {
          if (number % 2 == 0) {
            resolve("Even");
          } else {
            reject("Odd");
          }
        });
      }
      checkNumber(13)
        .then((message) => {
          console.log(message);
        })
        .catch((message) => {
          console.log(message);
        });
    </script>
  </body>
</html>
